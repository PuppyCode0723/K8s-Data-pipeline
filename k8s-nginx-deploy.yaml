---
- name: Deploy Nginx and Update Alloy Pipeline
  hosts: masters
  become: yes
  run_once: true
  tasks:
    - name: 1-1. 建立範例 Nginx 部署與 Service (NodePort)
      kubernetes.core.k8s:
        state: present
        definition:
          - apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: demo-nginx
              namespace: logging
              labels:
                app: demo-nginx
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: demo-nginx
              template:
                metadata:
                  labels:
                    app: demo-nginx
                spec:
                  containers:
                    - name: nginx
                      image: nginx:alpine
                      ports:
                        - containerPort: 80

          - apiVersion: v1
            kind: Service
            metadata:
              name: demo-nginx-svc
              namespace: logging
            spec:
              type: NodePort
              selector:
                app: demo-nginx
              ports:
                - port: 80
                  targetPort: 80
                  nodePort: 31080

    - name: 2-1. 更新 Alloy Helm 發行版以注入動態標籤管線
      kubernetes.core.helm:
        name: alloy
        chart_ref: grafana/alloy
        release_namespace: logging
        state: present
        values:
          controller:
            type: daemonset
          mounts:
            dockercontainers: true

          alloy:
            config: |
              // 1. 掃描所有節點本地的實體日誌檔案
              local.file_match "pod_logs" {
                path_targets = [
                  { "__path__" = "/var/log/pods/*/*/*.log" },
                ]
              }

              // 2. 本地 Loki 網址
              loki.write "local_loki" {
                endpoint {
                  url = "http://loki-headless.logging.svc.cluster.local:3100/loki/api/v1/push"
                }
              }

              // 3. 直接將掃描到的所有日誌檔案，全部倒進 Loki 出口
              loki.source.file "container_logs" {
                targets    = local.file_match.pod_logs.targets
                forward_to = [loki.write.local_loki.receiver]
              }

      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: 3-1. 查詢 Nginx 狀態
      shell: kubectl get pods -n logging -l app=demo-nginx
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: nginx_status
      changed_when: false

    - name: 【請複製以下驗證測試步驟】
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - " Nginx 狀態: {{ nginx_status.stdout }}"
          - "=========================================================="
